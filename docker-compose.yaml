# Файл: ./docker-compose.yaml
version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: mysite_db
    environment:
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: your-secure-password-change-this
      POSTGRES_DB: django_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mysite-network

  web:
    build:
      context: .                    # ✅ ИСПРАВЛЕНО: относительный путь
      dockerfile: Dockerfile        # ✅ Dockerfile в корне
    container_name: mysite_web
    command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-your-secret-key-here}
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,example.com
      DATABASES_HOST: db
      DATABASES_NAME: django_db
      DATABASES_USER: django_user
      DATABASES_PASSWORD: your-secure-password-change-this
      DATABASES_PORT: '5432'
      DJANGO_LOGLEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./mysite/logs:/app/mysite/logs
      - ./mysite/uploads:/app/mysite/uploads
      - ./mysite/staticfiles:/app/mysite/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mysite-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: mysite_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_storage:/var/lib/grafana
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - mysite-network

volumes:
  postgres_data:
  grafana_storage:

networks:
  mysite-network:
    driver: bridge
