version: '3.9'

services:
  # ════════════════════════════════════════════════════════════════
  # 🗄️ DATABASE (PostgreSQL)
  # ════════════════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    container_name: mysite_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mysite-network

  # ════════════════════════════════════════════════════════════════
  # 🌐 WEB APP (Django + Gunicorn) - PRODUCTION
  # ════════════════════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysite_web
    command: >
      sh -c "python manage.py migrate &&
             gunicorn mysite.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./mysite/database:/app/database
      - ./mysite/logs:/app/logs
      - ./mysite/uploads:/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env                           # ← ВСЕ переменные из .env файла
    environment:
      DATABASES_HOST: db              # ← Override для Docker
      DATABASES_PORT: "5432"
      DATABASES_NAME: django_db
      DATABASES_USER: postgres
      DATABASES_PASSWORD: postgres
      DJANGO_DEBUG: "0"               # ← Production mode
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mysite-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "200k"

  # ════════════════════════════════════════════════════════════════
  # 📊 GRAFANA (мониторинг)
  # ════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.2.0
    container_name: mysite_grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - mysite-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  grafana_storage:
    driver: local

networks:
  mysite-network:
    driver: bridge
